name: Sync Inner Mongolia admissions announcements

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and organize official announcements
        run: node scripts/sync-nm-notices.mjs
      - name: Commit verified changes
        run: |
          if git diff --quiet -- public/data/announcements.json; then
            echo "No announcement changes."
            exit 0
          fi
          git config user.name "mengzhiyuan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/announcements.json
          git commit -m "data: sync official admissions announcements"
          git push
