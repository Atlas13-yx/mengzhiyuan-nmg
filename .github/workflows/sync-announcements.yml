name: Sync Inner Mongolia admissions announcements

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Fetch once outside the configured season"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: official-announcement-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      # Optional YYYY-MM-DD repository variables; boundaries use Asia/Shanghai.
      SYNC_START_DATE: ${{ vars.SYNC_START_DATE }}
      SYNC_END_DATE: ${{ vars.SYNC_END_DATE }}
      FORCE_SYNC: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and organize official announcements
        run: node scripts/sync-nm-notices.mjs
      - name: Commit verified changes
        id: changes
        run: |
          if git diff --quiet -- public/data/announcements.json; then
            echo "No announcement changes."
            exit 0
          fi
          git config user.name "mengzhiyuan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/announcements.json
          git commit -m "data: sync official admissions announcements"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN pushes do not trigger the Pages push workflow.
      - name: Publish the updated announcement feed
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref "${{ github.event.repository.default_branch }}"
